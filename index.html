<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kabinett im Viereck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Planspiel zum magischen Viereck und Achteck der Wirtschaftspolitik für die Oberstufe (SOWI, Q1).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: Lagezentrum. Navy-Kopfleiste als Kommandobrücke, darunter helle Arbeitsfläche; das Viereck/Achteck-Radar ist das wiederkehrende Leitmotiv. */
:root{
  --bg:#EEF2F7; --surface:#FFFFFF; --surface-2:#F6F8FB; --ink:#12203A; --muted:#566079; --line:#D6DDE8;
  --navy:#12203A; --navy-ink:#F3F6FB; --accent:#FFC233; --accent-ink:#12203A;
  --good:#17955A; --warn:#C98200; --bad:#CF3A2B;
  --t1:#E4572E; --t2:#0C9A8A; --t3:#3557D0; --t4:#B0198F;
  --ring:#C7D0DE; --ring-strong:#12203A;
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r:14px; --shadow:0 1px 2px rgba(18,32,58,.06), 0 8px 24px rgba(18,32,58,.07);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1422; --surface:#151F33; --surface-2:#1B2740; --ink:#E7ECF5; --muted:#9AA6BF; --line:#2A3755;
  --navy:#08101D; --navy-ink:#F3F6FB; --accent:#FFC94D; --accent-ink:#12203A;
  --good:#3CC47E; --warn:#F0B13A; --bad:#FF6B5B;
  --t1:#FF7A52; --t2:#2CC7B4; --t3:#7B93FF; --t4:#E055C2;
  --ring:#33415F; --ring-strong:#E7ECF5; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1422; --surface:#151F33; --surface-2:#1B2740; --ink:#E7ECF5; --muted:#9AA6BF; --line:#2A3755;
  --navy:#08101D; --navy-ink:#F3F6FB; --accent:#FFC94D; --accent-ink:#12203A;
  --good:#3CC47E; --warn:#F0B13A; --bad:#FF6B5B;
  --t1:#FF7A52; --t2:#2CC7B4; --t3:#7B93FF; --t4:#E055C2;
  --ring:#33415F; --ring-strong:#E7ECF5; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Kopfleiste */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--navy-ink)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:1.15rem;text-decoration:none;color:var(--navy-ink);background:none;border:0;padding:0}
.brand svg{flex:none}
.nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.nav button{background:transparent;border:0;color:#C9D3E6;padding:8px 12px;border-radius:999px;font-weight:600;font-size:.92rem}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}

main{padding-block:28px 64px}
.view{display:flex;flex-direction:column;gap:28px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:10px;font-weight:600;transition:transform .12s ease, box-shadow .12s ease}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.big{padding:14px 22px;font-size:1.05rem;border-radius:12px}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;font-size:.85rem;border-radius:8px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.pill.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

/* Start */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:32px;align-items:center}
.hero h1{font-size:clamp(2.4rem,5.5vw,4.4rem);font-weight:800;letter-spacing:-.03em}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--accent) 62%);padding:0 .08em}
.hero .lead{font-size:1.15rem;color:var(--muted);max-width:56ch;margin-top:16px}
.hero-radar{justify-self:center;width:min(380px,100%)}
.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stage{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;transition:transform .15s, box-shadow .15s}
.stage:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stage .min{font-family:var(--font-mono);font-size:.8rem;color:var(--muted)}
.stage h3{font-size:1.25rem}
.stage p{color:var(--muted);font-size:.92rem}
.stage .step{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-weight:700;font-family:var(--font-mono);font-size:.85rem}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.role h4{font-size:1.05rem;margin-bottom:6px}
.role p{font-size:.92rem;color:var(--muted)}
.role .ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);margin-bottom:10px}

.join{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:center;background:var(--navy);color:var(--navy-ink);border-radius:18px;padding:24px 28px}
.join h2{font-size:clamp(1.4rem,2.6vw,2rem);margin:6px 0 8px}
.join p{color:#B9C4DA;max-width:60ch}
.join .join-url{color:var(--accent);font-size:1.1rem;margin-top:10px}
.join-qr{background:#fff;border-radius:16px;padding:6px;max-width:220px}
@media (max-width:760px){.join{grid-template-columns:1fr}.join-qr{max-width:200px}}
/* Lagebild */
.lage-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
.lage-head h1{font-size:clamp(2rem,4.2vw,3.2rem);font-weight:800}
.lage-grid{display:grid;grid-template-columns:minmax(260px,380px) minmax(0,1fr);gap:24px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tile .val{font-family:var(--font-mono);font-size:2.1rem;font-weight:700;letter-spacing:-.02em;line-height:1}
.tile .val.hidden{filter:blur(12px);user-select:none}
.tile .meta{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.tile .src{font-size:.75rem;color:var(--muted)}
.tile h3{font-size:1.05rem}

/* Quiz */
.quiz{max-width:760px;margin:0 auto;width:100%}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow)}
.qcard h2{font-size:clamp(1.25rem,2.6vw,1.6rem);font-weight:700}
.qprog{display:flex;gap:6px}
.qprog span{flex:1;height:6px;border-radius:4px;background:var(--line)}
.qprog span.ok{background:var(--good)} .qprog span.no{background:var(--bad)} .qprog span.cur{background:var(--accent)}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);font-weight:500;transition:border-color .12s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.opt:disabled{cursor:default}
.explain{border-left:4px solid var(--accent);background:var(--surface-2);padding:12px 14px;border-radius:0 10px 10px 0;font-size:.95rem}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}

/* Spiel */
.gamebar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--navy);color:var(--navy-ink);border-radius:var(--r);padding:16px 20px}
.gamebar .year{font-family:var(--font-display);font-size:2.2rem;font-weight:800;line-height:1}
.gamebar .sub{color:#B9C4DA;font-size:.9rem}
.gamebar .btn{border-color:transparent}
.timer{font-family:var(--font-mono);font-size:1.8rem;font-weight:700;padding:4px 12px;border-radius:10px;background:rgba(255,255,255,.08);min-width:5.5ch;text-align:center}
.timer.low{background:var(--bad);color:#fff}
.yearsteps{display:flex;gap:6px}
.yearsteps span{width:34px;height:8px;border-radius:4px;background:rgba(255,255,255,.18)}
.yearsteps span.done{background:var(--accent)} .yearsteps span.now{background:#fff}
.teams{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:14px}
.team{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--tc);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.team h3{font-size:1.2rem;display:flex;align-items:center;gap:8px}
.team .dot{width:12px;height:12px;border-radius:50%;background:var(--tc);flex:none}
.chips{display:flex;flex-direction:column;gap:6px}
.chip{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px;border-radius:9px;background:var(--surface-2);border:1px dashed var(--line);font-size:.9rem;font-weight:600;min-height:40px}
.chip.empty{color:var(--muted);font-weight:500}
.chip .c{font-family:var(--font-mono);font-size:.78rem;color:var(--muted);font-weight:500}
.budget{display:flex;flex-direction:column;gap:6px;font-size:.82rem}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.score-big{font-family:var(--font-mono);font-weight:700;font-size:1.5rem}
.why{font-size:.86rem;color:var(--muted);font-style:italic;border-left:3px solid var(--tc);padding-left:8px}

.banner{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;border-radius:var(--r);padding:18px 20px;background:color-mix(in srgb,var(--bad) 12%,var(--surface));border:2px solid var(--bad)}
.banner .flash{background:var(--bad);color:#fff;font-weight:800;letter-spacing:.1em;font-size:.78rem;padding:6px 10px;border-radius:6px;text-transform:uppercase}
.banner h3{font-size:1.3rem;margin-bottom:4px}
.ezb{display:flex;gap:14px;align-items:center;padding:14px 18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.ezb .rate{font-family:var(--font-mono);font-size:1.6rem;font-weight:700}

/* Modal / Kabinettssitzung */
.modal{position:fixed;inset:0;z-index:50;background:rgba(8,14,28,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 16px max(12px,env(safe-area-inset-left,0px));overflow:auto}
.sheet{background:var(--bg);border-radius:18px;width:min(1180px,100%);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.35);border-top:8px solid var(--tc)}
.sheet-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:18px 20px;border-bottom:1px solid var(--line);background:var(--surface);border-radius:12px 12px 0 0;position:sticky;top:0;z-index:2}
.sheet-head h2{font-size:1.4rem}
.sheet-body{padding:18px 20px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}
.cat-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cat-filter button{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:.82rem;font-weight:600}
.cat-filter button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.measures{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.mcard{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px;transition:border-color .12s, transform .12s}
.mcard:hover:not(:disabled){border-color:var(--ink)}
.mcard.sel{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 9%,var(--surface))}
.mcard:disabled{opacity:.5;cursor:not-allowed}
.mcard.locked{border-style:dashed;background:var(--surface-2)}
.mcard h4{font-size:1rem;font-family:var(--font-body);font-weight:700;letter-spacing:0}
.mcard .meta{display:flex;justify-content:space-between;gap:6px;font-size:.75rem;color:var(--muted);flex-wrap:wrap}
.arrows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.arrows div{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:.72rem;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:4px 8px;line-height:1.2;min-width:0}
.arrows b{font-size:.92rem;letter-spacing:-.04em;white-space:nowrap}
.up-good{color:var(--good)} .up-bad{color:var(--bad)} .flat{color:var(--muted)}
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:90px;align-self:start}
textarea,input[type=text],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:84px;resize:vertical}
label.lbl{font-size:.82rem;font-weight:600;color:var(--muted);display:block;margin-bottom:6px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;padding:12px;border-radius:10px;border:2px solid var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--bad)}

/* Ergebnisse */
.results{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:14px}
.res{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--tc);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.res h3{font-size:1.15rem;display:flex;gap:8px;align-items:center}
.vals{display:grid;grid-template-columns:1fr auto auto;gap:2px 10px;font-size:.85rem;align-items:center}
.vals .k{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vals .v{font-family:var(--font-mono);text-align:right}
.vals .d{font-family:var(--font-mono);font-size:.75rem;text-align:right;min-width:4.2ch}
.vals .sec{grid-column:1/-1;margin-top:6px;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
details.chain{border-top:1px solid var(--line);padding-top:8px}
details.chain summary{cursor:pointer;font-weight:600;font-size:.88rem}
.chain ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.84rem}
.chain li span{color:var(--muted)}
.rank{display:flex;flex-direction:column;gap:8px}
.rank-row{display:grid;grid-template-columns:2.2rem minmax(0,1fr) minmax(80px,2fr) 4.2rem 2.4rem;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--tc);border-radius:12px;padding:10px 14px;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.rank-row .pos{font-family:var(--font-display);font-weight:800;font-size:1.6rem}
.rank-row .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-row .sc{font-family:var(--font-mono);font-weight:700;font-size:1.25rem;text-align:right}
.rank-row .mv{font-family:var(--font-mono);font-weight:700;text-align:center;font-size:.9rem}
.rank-row .track{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.rank-row .track i{display:block;height:100%;background:var(--tc);border-radius:6px;transition:width .8s ease}

.reveal-cta{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--navy);color:var(--navy-ink);border-radius:18px;padding:26px 28px}
.reveal-cta h2{font-size:clamp(1.5rem,3vw,2.2rem)}
.reveal-cta p{color:#B9C4DA;margin-top:6px;max-width:62ch}
.charts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.charts.eight{grid-template-columns:repeat(4,minmax(0,1fr))}
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.chartbox h4{font-size:.95rem;margin-bottom:2px}
.chartbox .u{font-size:.75rem;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:4px;border-radius:2px;background:var(--tc)}
.questions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.questions .panel h4{font-size:1.1rem;margin-bottom:6px}
.weights{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 18px}
.weights label{font-size:.82rem;font-weight:600;display:flex;justify-content:space-between}
.weights input{width:100%;accent-color:var(--ink)}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{border:1px solid var(--line);background:var(--surface-2);padding:6px 12px;border-radius:999px;font-size:.82rem;font-weight:600}
.presets button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Berater + Quellen */
.berater-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.bcard h3{font-size:1.1rem}
.bcard .chainline{font-size:.88rem;background:var(--surface-2);border-radius:8px;padding:8px 10px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
.setup{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}
.teamin{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.teamin .f{border-left:6px solid var(--tc);padding-left:10px}
.evpick{display:grid;gap:8px}
.evpick label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.evpick input{margin-top:5px;accent-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;box-shadow:var(--shadow)}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px;border:2px solid var(--bad);border-radius:10px;background:var(--surface)}
svg text{font-family:var(--font-body)}

@media (max-width:1100px){
  .teams,.results{grid-template-columns:repeat(2,minmax(0,1fr))}
  .charts,.charts.eight{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sheet-body{grid-template-columns:1fr}
  .side{position:static}
  .stages{grid-template-columns:repeat(2,minmax(0,1fr))}
  .weights{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .hero,.lage-grid,.lage-head,.setup,.reveal-cta{grid-template-columns:1fr}
  .tiles,.roles,.questions,.teamin{grid-template-columns:1fr}
  .teams,.results,.stages{grid-template-columns:1fr}
  .rank-row{grid-template-columns:2rem minmax(0,1fr) 3.6rem 2.2rem}
  .rank-row .track{display:none}
  .nav{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap}
  .nav button{white-space:nowrap}
  .gamebar .year{font-size:1.7rem}
}
@media (max-width:480px){ .charts,.charts.eight,.weights{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>

/* =========================================================
   BEWERTUNG: Zielerreichungsgrad 0–100 je Ziel
   ========================================================= */
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function score(k, v, year, prevBip){
  let s;
  switch(k){
    case "infl": s = 100 - 35*Math.abs(v-2); break;
    case "alq":  s = 100 - 15*Math.max(0, v-3); break;
    case "lb":   s = 100 - 14*Math.max(0, Math.abs(v)-1); break;
    case "bip": { const d = v<2 ? 2-v : (v>3 ? v-3 : 0); s = 100 - 40*d - (prevBip==null?0:10*Math.max(0,Math.abs(v-prevBip)-1)); break; }
    case "thg": { const req = 649 - 42.2*(year-2025); s = 100 - 0.6*Math.max(0, v-req); break; }
    case "armut": s = 100 - 10*Math.max(0, v-11); break;
    case "nl":   s = 100 - 6*Math.max(0, v-8); break;
    case "ee": { const req = Math.min(80, 55 + 5*(year-2025)); s = 100 - 3*Math.max(0, req-v); break; }
  }
  return clamp(s,0,100);
}

/* =========================================================
   SIMULATION (rein funktional: aus Entscheidungen werden Jahreswerte)
   ========================================================= */
function countPicksBefore(team, id, round){ let n=0; for(let r=1;r<round;r++) for(const x of (team.choices[r-1]||[])) if(x===id) n++; return n; }

function simulate(team, n, event){
  const years=[{year:2026, v:{...START}, s:null, rate:RATE_START, contrib:[], ezb:null}];
  let rate = RATE_START;
  for(let t=1;t<=n;t++){
    const v={}; const contrib=[];
    for(const g of GOALS) v[g.k]=BASE[g.k][t];
    // Maßnahmen aller bisherigen Jahre (mit Verzögerung)
    for(let r=1;r<=t;r++){
      for(const id of (team.choices[r-1]||[])){
        const m=M[id]; if(!m) continue; const lag=t-r;
        for(const k in m.fx){ const a=m.fx[k]; const val=a[Math.min(lag,a.length-1)]; if(val){ v[k]+=val; contrib.push({src:m.name, r, k, val, lag}); } }
        if(m.shockBoost && event===m.shockBoost && r===EVENT_ROUND && lag===0){ v.infl-=0.5; contrib.push({src:m.name+" (im Schockjahr besonders wirksam)", r, k:"infl", val:-0.5, lag:0}); }
      }
    }
    // Schockereignis
    let mit=0;
    if(event && EVENTS[event] && t>=EVENT_ROUND){
      const E=EVENTS[event], lag=t-EVENT_ROUND;
      for(const id in E.mitig) mit += E.mitig[id]*countPicksBefore(team,id,EVENT_ROUND);
      mit=Math.min(E.mitigMax,mit);
      for(const k in E.fx){ const a=E.fx[k]; const val=(a[lag]??0)*(1-mit); if(val){ v[k]+=val; contrib.push({src:"Schock: "+E.title.split(":")[0], r:EVENT_ROUND, k, val, lag, shock:true}); } }
    }
    // EZB: Zins aus dem Vorjahr wirkt verzögert
    const gap = rate-2.0;
    const ezbFx={bip:-0.35*gap, infl:-0.25*gap, alq:0.12*gap};
    for(const k in ezbFx){ v[k]+=ezbFx[k]; if(Math.abs(ezbFx[k])>=0.01) contrib.push({src:`EZB-Leitzins ${fmt(rate,2)} %`, r:t, k, val:ezbFx[k], lag:1, ezb:true}); }
    // EZB reagiert auf Inflation im Euroraum (Deutschland ≈ 30 % Gewicht)
    const euroShock = (event && EVENTS[event] && t===EVENT_ROUND) ? EVENTS[event].euro : 0;
    const euroInfl = 0.7*(EURO_BASE[t]+euroShock) + 0.3*v.infl;
    let step = Math.round((0.5*(euroInfl-2.0))/0.25)*0.25; step = clamp(step,-0.5,0.5);
    const newRate = clamp(rate+step, 0, 4.5);
    const ezb={old:rate, rate:newRate, step:newRate-rate, euroInfl};
    rate=newRate;
    for(const k in v) v[k]=Math.round(v[k]*100)/100;
    const s={}; const prevBip=years[t-1].v.bip;
    for(const g of GOALS) s[g.k]=score(g.k, v[g.k], YEARS[t-1], prevBip);
    years.push({year:YEARS[t-1], v, s, rate, contrib, ezb, mit});
  }
  // Startjahr bewerten
  years[0].s=Object.fromEntries(GOALS.map(g=>[g.k,score(g.k,START[g.k],2026,null)]));
  return years;
}

const EQUAL_W = Object.fromEntries(GOALS.map(g=>[g.k,1]));
function index(s, weights, eight){
  let sum=0, wsum=0;
  for(const g of GOALS){ if(!eight && !g.core) continue; const w=weights?weights[g.k]:1; sum+=w*s[g.k]; wsum+=w; }
  return wsum? sum/wsum : 0;
}
function teamIndex(team, n, event, weights, eight){
  const ys=simulate(team,n,event); if(n<1) return index(ys[0].s,weights,eight);
  let t=0; for(let i=1;i<=n;i++) t+=index(ys[i].s,weights,eight); return t/n;
}

/* Haushalt */
function budgetFor(team, round){
  let room = BUDGET_BASE;
  if(team.notlage && round===EVENT_ROUND) room += NOTLAGE_PLUS;
  if(team.notlage && round>EVENT_ROUND) room -= NOTLAGE_TILGUNG;
  return room;
}
function svUsedBefore(team, round){
  let used=0;
  for(let r=1;r<round;r++){ const c=costSplit(team, team.choices[r-1]||[], SV_POT-used); used+=c.sv; }
  return used;
}
function costSplit(team, picks, svLeft){
  let sv=0, reg=0;
  for(const id of picks){ const m=M[id]; if(m.sv){ const take=Math.min(svLeft-sv, m.cost); sv+=take; reg+=m.cost-take; } else reg+=m.cost; }
  return {sv, reg};
}
function budgetState(team, round, picks){
  const svLeft = SV_POT - svUsedBefore(team, round);
  const c = costSplit(team, picks, svLeft);
  const room = budgetFor(team, round);
  return {room, reg:c.reg, sv:c.sv, svLeft, ok:c.reg<=room};
}

function fmt(x, d=1){ return ((Math.round(x*Math.pow(10,d))/Math.pow(10,d))+0).toLocaleString("de-DE",{minimumFractionDigits:d, maximumFractionDigits:d}); }
function fmtSigned(x,d=1){ const s=fmt(Math.abs(x),d); return (x>0.0001?"+":x<-0.0001?"−":"±")+s; }

function arrowFor(k, val){
  const a=Math.abs(val);
  if(a<0.04) return {sym:"○", cls:"flat"};
  const n = k==="thg"||k==="ee"||k==="nl" ? (a<3?1:2) : (a<0.25?1:2);
  const sym= n===1 ? (val>0?"↑":"↓") : (val>0?"⇈":"⇊");
  let goodDir = G[k].good; if(k==="lb") goodDir=-1; // Überschuss zu hoch: sinken ist gut
  if(k==="infl") goodDir=-1;
  const good = goodDir*val>0;
  return {sym, cls: good?"up-good":"up-bad"};
}

/* =========================================================
   GRAFIK: Radar (Viereck ↔ Achteck), Linien, Sparklines
   ========================================================= */
function radarSVG(s, opt={}){
  const size=opt.size||300, pad=opt.labels===false?10:44, R=(size/2)-pad, cx=size/2, cy=size/2;
  const t = opt.reveal ?? 0; const color=opt.color||"var(--ink)";
  const ang=i=>(-90+i*45)*Math.PI/180;
  const P=(i,r)=>[cx+Math.cos(ang(i))*r, cy+Math.sin(ang(i))*r];
  const lerp=(a,b,u)=>[a[0]+(b[0]-a[0])*u, a[1]+(b[1]-a[1])*u];
  function shape(radFn){
    const pts=[];
    for(let i=0;i<8;i++){
      const real=P(i,radFn(i));
      if(i%2===0) pts.push(real);
      else { const a=P(i-1,radFn(i-1)), b=P((i+1)%8,radFn((i+1)%8)); pts.push(lerp([(a[0]+b[0])/2,(a[1]+b[1])/2], real, t)); }
    }
    return pts.map(p=>p.map(x=>x.toFixed(1)).join(",")).join(" ");
  }
  let g="";
  for(const lvl of [25,50,75,100]){
    g+=`<polygon points="${shape(()=>R*lvl/100)}" fill="${lvl===100?"none":"none"}" stroke="${lvl===100?"var(--ring-strong)":"var(--ring)"}" stroke-width="${lvl===100?1.6:1}" ${lvl===100?'stroke-dasharray="5 4"':''}/>`;
  }
  for(let i=0;i<8;i++){ const [x,y]=P(i,R); const op=i%2===0?1:t; if(op>0) g+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--ring)" stroke-width="1" opacity="${op}"/>`; }
  const layers = opt.layers || [{s, color}];
  for(const L of layers){
    const pts=shape(i=>R*Math.max(4,L.s[GOALS[i].k])/100);
    g+=`<polygon points="${pts}" fill="${L.color}" fill-opacity="${layers.length>1?0.10:0.22}" stroke="${L.color}" stroke-width="${layers.length>1?2:2.5}" stroke-linejoin="round"/>`;
    if(layers.length===1) for(let i=0;i<8;i++){ if(i%2===1 && t<0.99) continue; const [x,y]=P(i,R*Math.max(4,L.s[GOALS[i].k])/100); g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${L.color}" stroke="var(--surface)" stroke-width="1.5"/>`; }
  }
  if(opt.labels!==false){
    for(let i=0;i<8;i++){
      const op=i%2===0?1:t; if(op<=0) continue;
      const [x,y]=P(i,R+14); const c=Math.cos(ang(i));
      const anchor = Math.abs(c)<0.2?"middle":(c>0?"start":"end");
      const dy = Math.sin(ang(i))<-0.7? -4 : (Math.sin(ang(i))>0.7? 14 : 4);
      const val = opt.values ? `<tspan x="${x.toFixed(1)}" dy="15" font-family="var(--font-mono)" font-size="11" fill="var(--muted)">${opt.values(GOALS[i])}</tspan>` : "";
      g+=`<text x="${x.toFixed(1)}" y="${(y+dy - (opt.values && Math.sin(ang(i))<-0.7?12:0)).toFixed(1)}" text-anchor="${anchor}" font-size="${opt.fs||13}" font-weight="700" fill="var(--ink)" opacity="${op}">${GOALS[i].short}${val}</text>`;
    }
  }
  const sx = opt.labels===false?0:Math.round(size*0.26);
  return `<svg viewBox="${-sx} 0 ${size+2*sx} ${size}" width="100%" role="img" aria-label="${esc(opt.aria||"Zielerreichung im Radar")}">${g}</svg>`;
}

function lineChart(series, opt){
  const W=320,H=180,l=36,r=16,tp=12,b=24;
  const xs=opt.years, n=xs.length;
  let lo=opt.min, hi=opt.max;
  for(const s of series) for(const v of s.vals){ if(v==null) continue; lo=Math.min(lo,v); hi=Math.max(hi,v); }
  const span=hi-lo||1; lo-=span*0.08; hi+=span*0.08;
  const X=i=>l+(W-l-r)*i/(n-1), Y=v=>tp+(H-tp-b)*(1-(v-lo)/(hi-lo));
  let g="";
  if(opt.band){ const [a,bb]=opt.band; const y1=Y(Math.min(hi,bb)), y2=Y(Math.max(lo,a)); if(y2>y1) g+=`<rect x="${l}" y="${y1.toFixed(1)}" width="${W-l-r}" height="${(y2-y1).toFixed(1)}" fill="var(--good)" opacity=".12"/>`; }
  const ticks=niceTicks(lo,hi,4);
  for(const tv of ticks){ const y=Y(tv); g+=`<line x1="${l}" x2="${W-r}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)"/><text x="${l-6}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="var(--font-mono)">${fmt(tv, opt.dec??1)}</text>`; }
  xs.forEach((yr,i)=>{ if(n<=7 || i%2===0 || i===n-1) g+=`<text x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="var(--font-mono)">${opt.short?("’"+String(yr).slice(2)):yr}</text>`; });
  for(const s of series){
    const pts=s.vals.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
    if(!pts.length) continue;
    g+=`<polyline points="${pts.map(p=>p.map(x=>x.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="${s.color}" stroke-width="${s.w||2.5}" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="4 4"':''}/>`;
    const last=pts[pts.length-1]; g+=`<circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.5" fill="${s.color}"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opt.aria||"Verlauf")}">${g}</svg>`;
}
function niceTicks(lo,hi,count){
  const span=hi-lo, step0=span/count, mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=step0)||mag*10;
  const out=[]; for(let v=Math.ceil(lo/step)*step; v<=hi+1e-9; v+=step) out.push(Math.round(v*1000)/1000); return out;
}

let QZ=null;
function newQuiz(){ const pool=[...QUIZ].sort(()=>Math.random()-.5); const pick=[]; const seen={}; for(const q of pool){ seen[q.t]=(seen[q.t]||0)+1; if(seen[q.t]<=2) pick.push(q); if(pick.length===10) break; } QZ={qs:pick, i:0, res:[], answered:null}; }
function renderQuiz(el){
  if(!QZ) newQuiz();
  const done = QZ.i>=QZ.qs.length;
  const right = QZ.res.filter(Boolean).length;
  if(done){
    el.innerHTML=`<div class="quiz"><div class="qcard" style="align-items:flex-start">
      <p class="eyebrow">Ergebnis</p><h2 style="font-size:2.4rem">${right} von ${QZ.qs.length} richtig</h2>
      <div class="qprog" style="width:100%">${QZ.res.map(r=>`<span class="${r?"ok":"no"}"></span>`).join("")}</div>
      <p class="muted">${right>=8?"Stark. Ihr seid bereit fürs Kabinett.":right>=5?"Solide Basis. Schaut euch die Erklärungen zu den Fehlern nochmal an.":"Lest im Arbeitsblatt nach: Kapitel 2 (positiv/normativ) und 3 (Bereiche, Träger)."}</p>
      <div class="row"><button class="btn primary" id="again">Neue Runde</button><button class="btn" data-go="berater">Zum Berater</button></div>
    </div></div>`;
    el.querySelector("#again").onclick=()=>{ newQuiz(); renderQuiz(el); };
    return;
  }
  const q=QZ.qs[QZ.i]; const ans=QZ.answered;
  el.innerHTML=`<div class="quiz"><div class="qcard">
    <div class="row"><span class="tag">${q.t}</span><span class="spacer"></span><span class="num small muted">Frage ${QZ.i+1}/${QZ.qs.length}</span></div>
    <div class="qprog">${QZ.qs.map((_,i)=>`<span class="${i<QZ.res.length?(QZ.res[i]?"ok":"no"):(i===QZ.i?"cur":"")}"></span>`).join("")}</div>
    <h2>${esc(q.q)}</h2>
    <div class="opts">${q.o.map((o,i)=>`<button class="opt ${ans!=null?(i===q.a?"right":(i===ans?"wrong":"")):""}" data-i="${i}" ${ans!=null?"disabled":""}>${esc(o)}</button>`).join("")}</div>
    ${ans!=null?`<div class="explain"><strong>${ans===q.a?"Richtig.":"Nicht ganz."}</strong> ${esc(q.e)}</div><div class="row"><span class="spacer"></span><button class="btn primary" id="next">${QZ.i===QZ.qs.length-1?"Ergebnis zeigen":"Weiter"}</button></div>`:""}
  </div><p class="small muted" style="text-align:center;margin-top:12px">Tipp für die Lehrkraft: Das Quiz läuft auf jedem Handy über denselben Link.</p></div>`;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ QZ.answered=+b.dataset.i; QZ.res.push(QZ.answered===q.a); renderQuiz(el); });
  const nx=el.querySelector("#next"); if(nx) nx.onclick=()=>{ QZ.i++; QZ.answered=null; renderQuiz(el); };
}

    <span class="spacer"></span>
    ${S.phase==="decide"?`<div class="row"><span class="timer ${S.timer.left<=60?"low":""}" id="timer">${mmss(S.timer.left)}</span>
      <button class="btn small" id="tStart">${S.timer.running?"Pause":"Start"}</button><button class="btn small ghost" style="color:inherit" id="tReset" aria-label="Timer zurücksetzen">↺ ${Math.round(S.timer.sec/60)} Min</button></div>`:""}
    ${S.phase==="decide"?`<button class="btn primary" id="evalBtn" ${allPicked?"":"disabled"}>Jahr ${yr} auswerten</button>`:
      (r<5?`<button class="btn primary" id="nextBtn">Weiter ins Jahr ${YEARS[r]}</button>`:`<button class="btn primary" data-go="auswertung">Zur Auswertung</button>`)}
  </div>`;
  let body="";
  if(r===EVENT_ROUND && ev) body+=`<div class="banner"><span class="flash">Eilmeldung</span><div><h3>${ev.title}</h3><p>${ev.text} <strong>Das Finanzministerium darf in diesem Jahr eine Notlage erklären</strong> (Art. 115 Abs. 2 GG): +${NOTLAGE_PLUS} Mrd. € Spielraum, danach ${NOTLAGE_TILGUNG} Mrd. € Tilgung pro Jahr.</p></div></div>`;
  if(S.phase==="decide"){
    body+=`<div class="teams" style="--n:${n}">${activeTeams().map((t,i)=>teamDecideCard(t,i,r)).join("")}</div>
    <p class="small muted">Analyse-Person jedes Teams kommt nach vorn, tippt auf „Kabinettsbeschluss“ und trägt zwei Maßnahmen samt Begründung ein. Das Jahr kann ausgewertet werden, sobald alle Teams zwei Maßnahmen gewählt haben.</p>`;
  } else {
    body+=resultView(r);
  }
  el.innerHTML=head+body+`<div class="row"><span class="spacer"></span><span id="resetZone"><button class="btn small ghost" id="resetBtn">Neues Spiel beginnen</button></span></div>`;
  wireSpiel(el);
}
function mmss(s){ return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; }
function teamDecideCard(t,i,r){
  const picks=t.choices[r-1]||[]; const b=budgetState(t,r,picks);
  const prev = r>1? teamIndex(t,r-1,S.event,null,false):null;
  return `<div class="team" style="--tc:${tc(i)}">
    <div class="row" style="justify-content:space-between"><h3><span class="dot"></span>${esc(t.name)}</h3>${prev!=null?`<span class="pill ${scoreClass(prev)} num">${fmt(prev,0)} Pkt.</span>`:""}</div>
    <div class="chips">${[0,1].map(j=>picks[j]?`<div class="chip">${esc(M[picks[j]].name)}<span class="c">${M[picks[j]].cost>0?"−":"+"}${Math.abs(M[picks[j]].cost)} Mrd.</span></div>`:`<div class="chip empty">Maßnahme ${j+1} offen</div>`).join("")}</div>
    ${budgetBar(b)}
    ${t.notes[r-1]?`<p class="why">„${esc(t.notes[r-1])}“</p>`:""}
    <button class="btn ${picks.length===2?"":"dark"}" data-team="${i}">${picks.length===2?"Beschluss ändern":"Kabinettsbeschluss"}</button>
  </div>`;
}
function budgetBar(b){
  const used=Math.max(0,b.reg), pct=Math.min(100,used/Math.max(1,b.room)*100);
  return `<div class="budget">
    <div class="row" style="justify-content:space-between"><span>Haushalt (Schuldenbremse)</span><span class="num ${b.ok?"":"up-bad"}">${fmt(b.reg,0)} / ${b.room} Mrd. €</span></div>
    <div class="bar"><i style="width:${pct}%;background:${b.ok?"var(--ink)":"var(--bad)"}"></i></div>
    <div class="row" style="justify-content:space-between"><span class="muted">Sondervermögen übrig</span><span class="num muted">${fmt(b.svLeft-b.sv,0)} von ${SV_POT} Mrd. €</span></div>
  </div>`;
}
function resultView(r){
  const n=S.nTeams; const sims=activeTeams().map(t=>simulate(t,r,S.event));
  const ezb=sims[0][r];
  const ranking=activeTeams().map((t,i)=>({i, name:t.name, sc:teamIndex(t,r,S.event,null,false)})).sort((a,b)=>b.sc-a.sc);
  let h=`<div class="ezb"><span class="pill neutral num" style="font-size:.9rem;padding:8px 12px">EZB</span><div><p class="eyebrow">EZB-Ratssitzung Dezember ${YEARS[r-1]}</p>
    <p>${ezbText(sims)}</p></div></div>`;
  h+=`<div class="results" style="--n:${n}">${activeTeams().map((t,i)=>{
    const y=sims[i][r], p=sims[i][r-1]; const idx=index(y.s,null,false);
    return `<div class="res" style="--tc:${tc(i)}">
      <div class="row" style="justify-content:space-between"><h3><span class="dot" style="width:12px;height:12px;border-radius:50%;background:${tc(i)}"></span>${esc(t.name)}</h3><span class="score-big" title="Zielerreichung ${YEARS[r-1]}">${fmt(idx,0)}</span></div>
      ${radarSVG(y.s,{size:260,fs:15,color:tc(i),aria:`Zielerreichung ${t.name} ${YEARS[r-1]}`})}
      <div class="vals">${CORE.map(g=>{ const d=y.v[g.k]-p.v[g.k]; const a=arrowFor(g.k,d);
        return `<span class="k">${g.short}</span><span class="v">${fmt(y.v[g.k],1)} %</span><span class="d ${a.cls}">${fmtSigned(d)}</span>`; }).join("")}</div>
      <div class="chips">${(t.choices[r-1]||[]).map(id=>`<div class="chip" style="min-height:0;padding:6px 10px;font-size:.82rem">${esc(M[id].name)}</div>`).join("")}</div>
      ${t.notes[r-1]?`<p class="why">„${esc(t.notes[r-1])}“</p>`:""}
      <details class="chain"><summary>Wirkungsketten ${YEARS[r-1]}</summary>${chainList(y, r)}</details>
    </div>`; }).join("")}</div>`;
  h+=`<div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:12px"><h3 style="font-size:1.2rem">Zwischenstand: Durchschnitt der Zielerreichung ${r===1?"2027":"2027–"+YEARS[r-1]}</h3><span class="small muted">0 = alle Ziele weit verfehlt · 100 = alle vier Ziele erreicht</span></div>
    <div class="rank">${ranking.map((x,pos)=>`<div class="rank-row" style="--tc:${tc(x.i)}"><span class="pos">${pos+1}</span><span class="nm">${esc(x.name)}</span><span class="track"><i style="width:${x.sc}%"></i></span><span class="sc">${fmt(x.sc,1)}</span><span></span></div>`).join("")}</div></div>
  <div class="panel"><h3 style="font-size:1.1rem;margin-bottom:6px">Begründungsrunde (2 Min.)</h3><p class="muted">Jede Analyse-Person erklärt in einem Satz: Welches Ziel hatte für euer Kabinett Vorrang, und welches habt ihr dafür in Kauf genommen? Die anderen achten darauf: Ist das eine positive oder eine normative Aussage?</p></div>`;
  return h;
}
function ezbText(sims){
  const r=S.round; const e=sims[0][r].ezb;
  const rates=sims.map(s=>s[r].ezb);
  const uniq=[...new Set(rates.map(x=>x.rate))];
  const verb = s=> s>0?`erhöht den Leitzins auf <strong class="num">${fmt(s.rate??0,2)} %</strong>`:"";
  if(uniq.length===1){
    const x=rates[0];
    if(x.step>0) return `Die EZB erhöht den Einlagesatz um ${fmt(x.step,2)} auf <strong class="num">${fmt(x.rate,2)} %</strong>, weil die Inflation im Euroraum (≈ ${fmt(x.euroInfl,1)} %) über dem Ziel liegt. Das bremst eure Wirtschaft im nächsten Jahr.`;
    if(x.step<0) return `Die EZB senkt den Einlagesatz um ${fmt(-x.step,2)} auf <strong class="num">${fmt(x.rate,2)} %</strong>. Die Inflation im Euroraum (≈ ${fmt(x.euroInfl,1)} %) erlaubt das. Das stützt eure Wirtschaft im nächsten Jahr.`;
    return `Die EZB lässt den Einlagesatz bei <strong class="num">${fmt(x.rate,2)} %</strong> (Inflation im Euroraum ≈ ${fmt(x.euroInfl,1)} %).`;
  }
  return `Die EZB reagiert auf die Inflation im Euroraum, zu der Deutschland rund 30 % beiträgt. Weil eure Kabinette unterschiedlich gehandelt haben, gilt im Spiel für jedes Team ein eigener Leitzins: ${activeTeams().map((t,i)=>`${esc(t.name)} <strong class="num">${fmt(rates[i].rate,2)} %</strong>`).join(" · ")}. Das ist eine Vereinfachung: In Wirklichkeit gibt es nur einen Zins für den ganzen Euroraum.`;
}
function chainList(y, r){
  const byKey={};
  for(const c of y.contrib){ if(!G[c.k].core) continue; const key=c.src+"|"+c.r; (byKey[key]=byKey[key]||{src:c.src, r:c.r, lag:c.lag, list:[], ezb:c.ezb, shock:c.shock}).list.push(c); }
  const items=Object.values(byKey).sort((a,b)=>a.lag-b.lag);
  if(!items.length) return `<p class="small muted">Keine Wirkungen.</p>`;
  return `<ul>${items.map(it=>{
    const m=MEASURES.find(x=>x.name===it.src);
    const when = it.ezb? "Zins wirkt mit Verzögerung" : it.shock? "äußerer Schock" : it.lag===0? "sofort" : `beschlossen ${YEARS[it.r-1]}, wirkt verzögert`;
    return `<li><strong>${esc(it.src)}</strong> <span>(${when})</span><br>${it.list.map(c=>{ const a=arrowFor(c.k,c.val); return `<span class="${a.cls}" style="white-space:nowrap">${G[c.k].short} ${fmtSigned(c.val,2)}</span>`; }).join(" · ")}${m&&it.lag===0?`<br><span>${esc(m.chain)}</span>`:""}</li>`; }).join("")}</ul>`;
}

function wireSpiel(el){
  const q=s=>el.querySelector(s);
  el.querySelectorAll("[data-team]").forEach(b=>b.onclick=()=>openCabinet(+b.dataset.team));
  if(q("#evalBtn")) q("#evalBtn").onclick=()=>{ stopTimer(); S.phase="result"; save(); render(); };
  if(q("#nextBtn")) q("#nextBtn").onclick=()=>{ S.round++; S.phase="decide"; S.timer.left=S.timer.sec; S.timer.running=false; save(); render(); };
  if(q("#tStart")) q("#tStart").onclick=()=>{ S.timer.running?stopTimer():startTimer(); render(); };
  if(q("#tReset")) q("#tReset").onclick=()=>{ stopTimer(); const opts=[300,360,420,480,540,600]; const i=opts.indexOf(S.timer.sec); S.timer.sec = S.timer.left!==S.timer.sec? S.timer.sec : opts[(i+1)%opts.length]; S.timer.left=S.timer.sec; save(); render(); };
  q("#resetBtn").onclick=()=>{ q("#resetZone").innerHTML=`<span class="confirm"><span>Alle Entscheidungen löschen und neu starten?</span><button class="btn small dark" id="resetYes">Ja, neues Spiel</button><button class="btn small" id="resetNo">Abbrechen</button></span>`;
    q("#resetYes").onclick=()=>{ stopTimer(); S=freshState(); save(); render(); }; q("#resetNo").onclick=()=>render(); };
}
function startTimer(){ S.timer.running=true; clearInterval(timerHandle); timerHandle=setInterval(()=>{ S.timer.left=Math.max(0,S.timer.left-1); const t=document.getElementById("timer"); if(t){ t.textContent=mmss(S.timer.left); t.classList.toggle("low",S.timer.left<=60); } if(S.timer.left===0){ stopTimer(); toast("Zeit ist um: Kabinettsbeschlüsse eintragen!"); const b=document.getElementById("tStart"); if(b) b.textContent="Start"; } save(); },1000); }
function stopTimer(){ S.timer.running=false; clearInterval(timerHandle); save(); }

  <p class="muted" style="margin-top:8px;max-width:70ch">Dieses Gerät ist die gemeinsame Bühne am Beamer. Der Spielstand wird automatisch in diesem Browser gespeichert, auch wenn die Seite neu geladen wird.</p></div>
  <div class="setup">
    <div class="panel"><h3 style="font-size:1.15rem;margin-bottom:12px">Teams</h3>

      <div class="teamin">${S.teams.map((t,i)=>`<div class="f" style="--tc:${tc(i)};${i>=S.nTeams?"opacity:.35":""}"><label class="lbl" for="tn${i}">Name Kabinett ${i+1}</label><input type="text" id="tn${i}" value="${esc(t.name)}" maxlength="28" ${i>=S.nTeams?"disabled":""}></div>`).join("")}</div>
    </div>
    <div class="panel"><h3 style="font-size:1.15rem;margin-bottom:4px">Krisenereignis in Runde 3 (2029)</h3><p class="small muted" style="margin-bottom:12px">Trifft alle Teams gleich. Wer vorgesorgt hat, wird weniger hart getroffen.</p>
      <div class="evpick">${Object.entries(EVENTS).map(([k,e])=>`<label><input type="radio" name="ev" value="${k}" ${S.event===k?"checked":""}><span><strong>${e.title}</strong><br><span class="small muted">${e.text}</span></span></label>`).join("")}
      <label><input type="radio" name="ev" value="zufall" ${S.event==="zufall"?"checked":""}><span><strong>Zufall</strong><br><span class="small muted">Wird erst in Runde 3 enthüllt.</span></span></label></div>
    </div>
  </div>
  <div class="panel"><h3 style="font-size:1.1rem;margin-bottom:8px">Spielregeln in Kürze</h3>

      <li><strong>Schuldenbremse:</strong> ${BUDGET_BASE} Mrd. € Spielraum pro Jahr. Einnahmen (z. B. CO₂-Preis, Sparpaket) erweitern ihn. Investitionen in Infrastruktur und Energie können aus dem Sondervermögen (${SV_POT} Mrd. € für das ganze Spiel) bezahlt werden.</li>
      <li><strong>Nicht eure Zuständigkeit:</strong> Leitzins (EZB), Löhne (Tarifparteien), Zölle (EU). Die EZB reagiert aber auf eure Inflation.</li>
      <li>Viele Maßnahmen wirken <strong>verzögert</strong> oder kehren sich über die Zeit um. Der Berater auf dem Handy zeigt die Richtung, nicht die genauen Zahlen.</li>
      <li>Gewertet wird die durchschnittliche Zielerreichung im magischen Viereck über alle Jahre.</li>
    </ul>
  </div>
  <div class="row"><button class="btn primary big" id="go">Spiel starten: Jahr 2027</button><button class="btn big" data-go="berater">Berater ansehen</button></div>`;
  const nT=el.querySelector("#nTeams");
  nT.onchange=()=>{ S.nTeams=+nT.value; readNames(); save(); renderSetup(el); };
  function readNames(){ S.teams.forEach((t,i)=>{ const inp=el.querySelector("#tn"+i); if(inp && !inp.disabled) t.name=inp.value.trim()||DEFAULT_NAMES[i]; }); const ev=el.querySelector('input[name="ev"]:checked'); if(ev) S.event=ev.value; }
  el.querySelectorAll('input[name="ev"]').forEach(x=>x.onchange=()=>{ S.event=x.value; save(); });
  el.querySelector("#go").onclick=()=>{ readNames(); if(S.event==="zufall"){ const ks=Object.keys(EVENTS); S.event=ks[Math.floor(Math.random()*ks.length)]; S.eventHidden=true; } S.phase="decide"; S.round=1; S.timer.left=S.timer.sec; S.teams.forEach(t=>{t.choices=[];t.notes=[];t.notlage=false;}); save(); render(); };
}

/* Kabinettssitzung (Auswahl-Dialog) */
let catFilter="alle";
function openCabinet(i){
  const t=S.teams[i], r=S.round; let picks=[...(t.choices[r-1]||[])]; let note=t.notes[r-1]||""; let notlage=t.notlage;
  const wrap=document.createElement("div"); wrap.className="modal"; wrap.setAttribute("role","dialog"); wrap.setAttribute("aria-modal","true");
  document.body.appendChild(wrap); document.body.style.overflow="hidden";
  function close(){ wrap.remove(); document.body.style.overflow=""; render(); }
  function draw(){
    const tmp={...t, notlage}; const b=budgetState(tmp,r,picks);
    const areaKeys=["alle",...Object.keys(AREAS)];
    wrap.innerHTML=`<div class="sheet" style="--tc:${tc(i)}">
      <div class="sheet-head"><div><p class="eyebrow">Kabinettsbeschluss ${YEARS[r-1]}</p><h2>${esc(t.name)}</h2></div><span class="spacer"></span>
        <span class="pill neutral num">${picks.length}/2 gewählt</span>
        <button class="btn" id="cancel">Abbrechen</button><button class="btn primary" id="ok" ${picks.length===2&&b.ok?"":"disabled"}>Beschließen</button></div>
      <div class="sheet-body">
        <div>
          <div class="cat-filter" role="group" aria-label="Filter nach Bereich">${areaKeys.map(k=>`<button data-cat="${k}" aria-pressed="${catFilter===k}">${k==="alle"?"Alle":AREAS[k]}</button>`).join("")}</div>
          <div class="measures">${MEASURES.filter(m=>catFilter==="alle"||m.area===catFilter).map(m=>{
            const sel=picks.includes(m.id); const usedBefore=countPicksBefore(t,m.id,r); const max=m.max??2; const full=usedBefore>=max;
            const dis = full || (!sel && picks.length>=2);
            return `<button class="mcard ${sel?"sel":""}" data-m="${m.id}" ${dis&&!sel?"disabled":""} aria-pressed="${sel}">
              <div class="meta"><span>${AREAS[m.area]}</span><span class="num">${m.cost>0?"kostet "+m.cost:m.cost<0?"bringt "+(-m.cost):"kostenneutral"}${m.cost?" Mrd. €":""}${m.sv?" · SV":""}</span></div>
              <h4>${esc(m.name)}</h4><p class="small muted">${esc(m.desc)}</p>
              ${arrowsRow(m)}
              ${full?`<span class="small up-bad">Schon ${usedBefore}× beschlossen (Maximum)</span>`:usedBefore?`<span class="small muted">Bereits ${usedBefore}× beschlossen, wirkt erneut zusätzlich</span>`:""}
            </button>`; }).join("")}
            ${LOCKED.map(l=>`<button class="mcard locked" data-lock="${esc(l.why)}"><div class="meta"><span>nicht zuständig</span><span>🔒</span></div><h4>${esc(l.name)}</h4><p class="small muted">Antippen: Warum geht das nicht?</p></button>`).join("")}
          </div>
        </div>
        <aside class="side">
          <div class="panel">${budgetBar(b)}${!b.ok?`<p class="small up-bad" style="margin-top:8px">Die Schuldenbremse ist verletzt. Wählt eine günstigere Maßnahme oder eine, die Einnahmen bringt.</p>`:""}</div>
          ${r===EVENT_ROUND?`<label class="check"><input type="checkbox" id="notlage" ${notlage?"checked":""}><span><strong>Notlage erklären</strong> (Art. 115 Abs. 2 GG): +${NOTLAGE_PLUS} Mrd. € in ${YEARS[r-1]}, danach jedes Jahr ${NOTLAGE_TILGUNG} Mrd. € weniger Spielraum (Tilgung).</span></label>`:(t.notlage&&r>EVENT_ROUND?`<p class="small muted">Notlage aus 2029: ${NOTLAGE_TILGUNG} Mrd. € Tilgung in diesem Jahr.</p>`:"")}
          <div><label class="lbl" for="note">Begründung: Welches Ziel hat Vorrang, was nehmt ihr in Kauf?</label><textarea id="note" maxlength="200" placeholder="z. B. Wir bekämpfen zuerst die Arbeitslosigkeit und nehmen etwas mehr Inflation in Kauf.">${esc(note)}</textarea></div>
          <p class="small muted">Legende: ↑ steigt, ⇈ steigt stark, ↓ sinkt · <span class="up-good">grün</span> = in Richtung Ziel, <span class="up-bad">rot</span> = weg vom Ziel. Sofort / nach 1 Jahr / langfristig.</p>
          <div id="lockInfo"></div>
        </aside>
      </div></div>`;
    wrap.querySelector("#cancel").onclick=close;
    wrap.querySelector("#ok").onclick=()=>{ t.choices[r-1]=picks; t.notes[r-1]=wrap.querySelector("#note").value.trim(); if(r===EVENT_ROUND) t.notlage=notlage; save(); close(); };
    wrap.querySelectorAll("[data-cat]").forEach(x=>x.onclick=()=>{ note=wrap.querySelector("#note").value; catFilter=x.dataset.cat; draw(); });
    wrap.querySelectorAll("[data-m]").forEach(x=>x.onclick=()=>{ note=wrap.querySelector("#note").value; const id=x.dataset.m; picks = picks.includes(id)? picks.filter(p=>p!==id) : [...picks,id].slice(0,2); draw(); });
    wrap.querySelectorAll("[data-lock]").forEach(x=>x.onclick=()=>{ wrap.querySelector("#lockInfo").innerHTML=`<div class="explain">${x.dataset.lock}</div>`; });

function arrowsRow(m){
  return `<div class="arrows">${CORE.map(g=>{ const a=m.fx[g.k]||[0,0,0];
    const cells=[a[0]||0, a[1]??a[0]??0, a[a.length-1]||0].map(v=>arrowFor(g.k,v));
    return `<div title="${g.name}: sofort / nach 1 Jahr / langfristig"><span>${g.short==="Außenwirtschaft"?"Außenw.":g.short==="Beschäftigung"?"Beschäft.":g.short}</span><b>${cells.map(c=>`<span class="${c.cls}">${c.sym}</span>`).join(" ")}</b></div>`; }).join("")}</div>`;
}

function renderBerater(el){
  const areaKeys=["alle",...Object.keys(AREAS)];
  el.innerHTML=`<div><p class="eyebrow">Gutachten für die Kabinette</p><h1 style="font-size:clamp(1.9rem,4vw,2.8rem);margin-top:8px">Berater: Maßnahmen und Wirkungsketten</h1>

    <div class="berater-list">${MEASURES.filter(m=>berFilter==="alle"||m.area===berFilter).map(m=>`<article class="bcard">
      <div class="row" style="justify-content:space-between"><span class="tag">${AREAS[m.area]}</span><span class="num small muted">${m.cost>0?"kostet "+m.cost+" Mrd. €":m.cost<0?"bringt "+(-m.cost)+" Mrd. €":"kostenneutral"}${m.sv?" · Sondervermögen möglich":""}</span></div>
      <h3>${esc(m.name)}</h3><p class="small muted">Träger: ${esc(m.traeger)}</p><p class="small">${esc(m.desc)}</p>
      ${arrowsRow(m)}
      <p class="chainline">${esc(m.chain)}</p></article>`).join("")}</div>
    <div><h2 style="font-size:1.4rem;margin-bottom:12px">Nicht in der Hand der Bundesregierung</h2>
    <div class="berater-list">${LOCKED.map(l=>`<article class="bcard" style="background:var(--surface-2)"><h3>🔒 ${esc(l.name)}</h3><p class="small">${esc(l.why)}</p></article>`).join("")}</div></div>`;
  el.querySelectorAll("[data-cat]").forEach(x=>x.onclick=()=>{ berFilter=x.dataset.cat; renderBerater(el); });
}

/* ---------- AUSWERTUNG + OKTOGON ---------- */
const PRESETS={
  gleich:{label:"Alle gleich", w:EQUAL_W},
  gewerkschaft:{label:"Gewerkschaft", w:{infl:1,thg:0.5,alq:3,armut:2,lb:0.5,nl:3,bip:1,ee:0.5}},
  arbeitgeber:{label:"Arbeitgeberverband", w:{infl:1.5,thg:0.5,alq:1,armut:0.5,lb:1.5,nl:0.5,bip:3,ee:0.5}},
  umwelt:{label:"Umweltverband", w:{infl:0.5,thg:3,alq:0.5,armut:1,lb:0.5,nl:0.5,bip:0.5,ee:3}},
  ezb:{label:"EZB / Bundesbank", w:{infl:4,thg:0.5,alq:0.5,armut:0.5,lb:1,nl:0.5,bip:1,ee:0.5}},
  sozial:{label:"Sozialverband", w:{infl:1.5,thg:0.5,alq:2,armut:3,lb:0.5,nl:2,bip:0.5,ee:0.5}},
};
let revealAnim=null;
function renderAuswertung(el){
  const n = evaluated();
  if(S.phase==="setup" || n<1){
    el.innerHTML=`<div class="panel"><h2 style="font-size:1.6rem;margin-bottom:8px">Noch keine Ergebnisse</h2><p class="muted">Die Auswertung füllt sich, sobald im Planspiel das erste Jahr ausgewertet wurde.</p><div class="row" style="margin-top:14px"><button class="btn primary" data-go="spiel">Zum Planspiel</button></div></div>`; return;
  }
  const teams=activeTeams(); const sims=teams.map(t=>simulate(t,n,S.event));
  const rev=S.revealed; const W=S.weights;
  const rank4=teams.map((t,i)=>({i,name:t.name,sc:teamIndex(t,n,S.event,null,false)})).sort((a,b)=>b.sc-a.sc);
  const rank8=teams.map((t,i)=>({i,name:t.name,sc:teamIndex(t,n,S.event,W,true)})).sort((a,b)=>b.sc-a.sc);
  const shown = rev? rank8 : rank4;
  const pos4=Object.fromEntries(rank4.map((x,p)=>[x.i,p]));
  const goals = rev? GOALS : CORE;
  const years=[2026,...YEARS.slice(0,n)];
  el.innerHTML=`
  <div class="lage-head"><div><p class="eyebrow">Auswertung · ${n<5?`Zwischenstand nach ${n} von 5 Jahren`:"Ende der Legislatur 2031"}</p>
    <h1 style="margin-top:8px">${rev?"Das magische Achteck":"Wer hat welches Ziel geopfert?"}</h1></div>
    <div class="legend">${teams.map((t,i)=>`<span style="--tc:${tc(i)}"><i></i>${esc(t.name)}</span>`).join("")}</div></div>
  <div class="results" style="--n:${teams.length}" id="radars">${teams.map((t,i)=>{
    const last=sims[i][n];
    return `<div class="res" style="--tc:${tc(i)}"><h3><span style="width:12px;height:12px;border-radius:50%;background:${tc(i)}"></span>${esc(t.name)}</h3>
      <div class="radar-slot" data-i="${i}">${radarSVG(last.s,{size:260,fs:15,color:tc(i),reveal:rev?1:0})}</div>
      <div class="vals">${(rev?GOALS:CORE).map(g=>`<span class="k">${g.short}</span><span class="v">${fmt(last.v[g.k],g.dec)}${g.unit}</span><span class="d ${scoreClass(last.s[g.k])==="good"?"up-good":scoreClass(last.s[g.k])==="bad"?"up-bad":"flat"}">${fmt(last.s[g.k],0)}</span>`).join("")}</div>
    </div>`; }).join("")}</div>
  <div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:12px"><h3 style="font-size:1.25rem">${rev?"Rangliste im Achteck":"Rangliste im Viereck"}</h3><span class="small muted">Durchschnittliche Zielerreichung 2027–${YEARS[n-1]} (0–100)</span></div>
    <div class="rank" id="rank">${shown.map((x,p)=>{ const mv=rev? pos4[x.i]-p : 0;
      return `<div class="rank-row" data-i="${x.i}" style="--tc:${tc(x.i)}"><span class="pos">${p+1}</span><span class="nm">${esc(x.name)}</span><span class="track"><i style="width:${x.sc}%"></i></span><span class="sc">${fmt(x.sc,1)}</span><span class="mv ${mv>0?"up-good":mv<0?"up-bad":"flat"}">${rev?(mv>0?"▲"+mv:mv<0?"▼"+(-mv):"="):""}</span></div>`; }).join("")}</div></div>
  ${rev?revealExtras(n):""}
  ${!rev?`<div class="reveal-cta"><div><p class="eyebrow" style="color:#B9C4DA">Ausblick</p><h2>Die Simulation hat heimlich vier weitere Ziele mitgerechnet.</h2><p>Umwelt, gerechte Verteilung, humane Arbeitsbedingungen und Ressourcen. Keines davon steht im Stabilitätsgesetz von 1967. Was passiert mit der Rangliste, wenn sie zählen?</p></div><button class="btn primary big" id="reveal">Oktogon aufdecken</button></div>`:""}
  <div><h2 style="font-size:1.4rem;margin-bottom:12px">Verlauf ${rev?"aller acht Ziele":"der vier Ziele"}</h2>
  <div class="charts">${goals.map(g=>{ const band = {infl:[1.5,2.5], alq:[0,3], lb:[-1,1], bip:[2,3], thg:null, armut:[0,11], nl:[0,8], ee:[80,100]}[g.k];
    return `<div class="chartbox"><h4>${g.name}</h4><p class="u">${g.ind} · Ziel: ${g.target}</p>${lineChart(teams.map((t,i)=>({vals:sims[i].map(y=>y.v[g.k]), color:tc(i)})),{years, min:{infl:1.5,alq:3,lb:0,bip:0,thg:430,armut:11,nl:8,ee:55}[g.k], max:{infl:3,alq:6.5,lb:5,bip:2.5,thg:640,armut:16,nl:16,ee:80}[g.k], band, dec:g.dec, aria:g.ind})}</div>`; }).join("")}</div></div>
  <div class="questions">
    <div class="panel"><p class="eyebrow">Leitfrage 1</p><h4>Wer hat jetzt „gewonnen“?</h4><p class="muted">Und wer entscheidet, welche Ziele zählen? Die Wirkungen sind positive Aussagen, die Gewichtung der Ziele ist eine normative Entscheidung.</p></div>
    <div class="panel"><p class="eyebrow">Leitfrage 2</p><h4>Ist das Viereck von 1967 noch zeitgemäß?</h4><p class="muted">Nutzt die drei Positionen aus Kapitel 4.5: Viereck genügt, Sechseck überfällig, das Problem ist die Gewichtung.</p></div>
    <div class="panel"><p class="eyebrow">Leitfrage 3</p><h4>Wer würde welche Ecke stärker gewichten?</h4><p class="muted">Gewerkschaft, Arbeitgeberverband, Umweltverband, EZB. ${rev?"Probiert die Blickwinkel oben aus.":"Das ist die Brücke zur nächsten Stunde."}</p></div>
  </div>`;
  const rb=el.querySelector("#reveal"); if(rb) rb.onclick=()=>doReveal(el, n, sims, rank4);
  wirePresets(el);
}
function revealExtras(n){
  return `<div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h3 style="font-size:1.2rem">Blickwinkel: Wie gewichtet ihr die acht Ziele?</h3><span class="small muted">Die Rangliste oben rechnet sofort neu.</span></div>
    <div class="presets" style="margin-bottom:14px">${Object.entries(PRESETS).map(([k,p])=>`<button data-preset="${k}" aria-pressed="${S.weightsPreset===k}">${p.label}</button>`).join("")}</div>
    <div class="weights">${GOALS.map(g=>`<div><label for="w-${g.k}"><span>${g.short}</span><span class="num" id="wv-${g.k}">${fmt(S.weights[g.k],1)}×</span></label><input type="range" id="w-${g.k}" min="0" max="4" step="0.5" value="${S.weights[g.k]}"></div>`).join("")}</div>
    <p class="small muted" style="margin-top:12px">Hinweis aus dem Arbeitsblatt (4.3, M2): Sobald ein Indikator mehr misst als wirtschaftliche Aktivität, muss entschieden werden, wie stark die Bestandteile zählen. Diese Gewichtung ist unvermeidlich normativ.</p>
    <details class="chain" style="margin-top:10px"><summary>Startwerte der vier Zusatzziele</summary><ul>${GOALS.filter(g=>!g.core).map(g=>`<li><strong>${g.name}</strong> (${g.ind}): ${HIDDEN_START_NOTE[g.k]}</li>`).join("")}</ul></details></div>`;
}
function wirePresets(el){
  el.querySelectorAll("[data-preset]").forEach(b=>b.onclick=()=>{ S.weightsPreset=b.dataset.preset; S.weights={...PRESETS[b.dataset.preset].w}; save(); updateRanking(el); el.querySelectorAll("[data-preset]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.preset===S.weightsPreset)); GOALS.forEach(g=>{ el.querySelector("#w-"+g.k).value=S.weights[g.k]; el.querySelector("#wv-"+g.k).textContent=fmt(S.weights[g.k],1)+"×"; }); });
  GOALS.forEach(g=>{ const inp=el.querySelector("#w-"+g.k); if(!inp) return; inp.oninput=()=>{ S.weights[g.k]=+inp.value; S.weightsPreset="eigene"; el.querySelector("#wv-"+g.k).textContent=fmt(+inp.value,1)+"×"; el.querySelectorAll("[data-preset]").forEach(x=>x.setAttribute("aria-pressed","false")); save(); updateRanking(el); }; });
}
function updateRanking(el){
  const n=evaluated(); const teams=activeTeams();
  const rank4=teams.map((t,i)=>({i,sc:teamIndex(t,n,S.event,null,false)})).sort((a,b)=>b.sc-a.sc);
  const pos4=Object.fromEntries(rank4.map((x,p)=>[x.i,p]));
  const rank8=teams.map((t,i)=>({i,name:t.name,sc:teamIndex(t,n,S.event,S.weights,true)})).sort((a,b)=>b.sc-a.sc);
  flipRank(el, rank8, pos4);
}
function flipRank(el, ranking, pos4){
  const box=el.querySelector("#rank"); const rows=[...box.children];
  const first=Object.fromEntries(rows.map(r=>[r.dataset.i, r.getBoundingClientRect().top]));
  ranking.forEach((x,p)=>{ const row=rows.find(r=>+r.dataset.i===x.i); box.appendChild(row); row.querySelector(".pos").textContent=p+1; row.querySelector(".sc").textContent=fmt(x.sc,1); row.querySelector(".track i").style.width=x.sc+"%";
    const mv=pos4[x.i]-p; const m=row.querySelector(".mv"); m.className="mv "+(mv>0?"up-good":mv<0?"up-bad":"flat"); m.textContent=mv>0?"▲"+mv:mv<0?"▼"+(-mv):"="; });
  [...box.children].forEach(r=>{ const d=first[r.dataset.i]-r.getBoundingClientRect().top; if(d){ r.style.transition="none"; r.style.transform=`translateY(${d}px)`; requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ r.style.transition=""; r.style.transform=""; }); }); } });
}
function doReveal(el, n, sims, rank4){
  const btn=el.querySelector("#reveal"); btn.disabled=true;
  const slots=[...el.querySelectorAll(".radar-slot")];
  const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dur=reduce?1:1800; const t0=performance.now();
  function frame(now){
    const u=Math.min(1,(now-t0)/dur); const e=1-Math.pow(1-u,3);
    slots.forEach(s=>{ const i=+s.dataset.i; s.innerHTML=radarSVG(sims[i][n].s,{size:260,fs:15,color:tc(i),reveal:e}); });
    if(u<1) requestAnimationFrame(frame);
    else { S.revealed=true; save();
      const pos4=Object.fromEntries(rank4.map((x,p)=>[x.i,p]));
      const rank8=activeTeams().map((t,i)=>({i,name:t.name,sc:teamIndex(t,n,S.event,S.weights,true)})).sort((a,b)=>b.sc-a.sc);
      flipRank(el, rank8, pos4);
      setTimeout(()=>{ renderAuswertung(el); },1200);
    }
  }
  requestAnimationFrame(frame);
}

/* ---------- QUELLEN & MODELL ---------- */
function renderQuellen(el){
  el.innerHTML=`<div><p class="eyebrow">Transparenz</p><h1 style="font-size:clamp(1.9rem,4vw,2.8rem);margin-top:8px">Quellen und Modell</h1>
   <p class="muted" style="margin-top:8px;max-width:72ch">Die Startwerte stammen aus amtlichen Quellen (Stand 24.11.2026). Die Wirkungen der Maßnahmen sind ein vereinfachtes Lehrmodell: Richtung und ungefähre Größenordnung orientieren sich an Lehrbuchwissen und empirischen Studien, die genauen Zahlen sind aber gesetzt. Gute Frage für den Kurs: Wo ist das Modell zu einfach?</p></div>
  <div class="tablewrap"><table><thead><tr><th>Wert</th><th>Quelle</th></tr></thead><tbody>
   ${SOURCES.map(s=>`<tr><td>${esc(s[0])}</td><td>${s[2]?`<a href="${s[2]}" target="_blank" rel="noopener">${esc(s[1])}</a>`:esc(s[1])}</td></tr>`).join("")}
  </tbody></table></div>
  <div class="panel"><h3 style="font-size:1.15rem;margin-bottom:8px">So rechnet die Simulation</h3>
   <ul style="margin:0;padding-left:20px;display:grid;gap:8px" class="muted">
    <li><strong>Basispfad:</strong> Ohne Politik erholt sich die Wirtschaft langsam (Wachstum ≈ 1 %, Inflation sinkt Richtung 2 %, Arbeitslosigkeit sinkt leicht). Er orientiert sich an der Jahresprojektion 2026 der Bundesregierung.</li>
    <li><strong>Maßnahmen</strong> verschieben den Pfad: sofort, nach einem Jahr und langfristig. Wer eine Maßnahme zweimal beschließt, bekommt die Wirkung zweimal.</li>
    <li><strong>EZB:</strong> Sie reagiert auf die Inflation im Euroraum, zu der Deutschland etwa 30 % beiträgt. Liegt sie über 2 %, steigt der Zins; das bremst ein Jahr später Wachstum und Inflation und erhöht die Arbeitslosigkeit.</li>
    <li><strong>Krisenereignis 2029:</strong> trifft alle Teams gleich. Vorsorgende Maßnahmen in den Jahren davor dämpfen den Schock (Energieunabhängigkeit, neue Handelsmärkte, Fachkräfte).</li>
    <li><strong>Zielerreichung (0–100):</strong> Inflation: 100 bei 2 %, je Prozentpunkt Abweichung −35. Arbeitslosigkeit: 100 bei höchstens 3 %, je Punkt darüber −15. Leistungsbilanz: 100 bei ±1 %, je Punkt darüber −14. Wachstum: 100 bei 2–3 %, je Punkt Abstand −40, starke Sprünge kosten zusätzlich. Die Zusatzziele messen den Abstand zum Klimapfad, zum Erneuerbaren-Ziel 2030 und zu Spielzielen für Armut (11 %) und Niedriglohn (8 %).</li>
    <li><strong>Datenrevisionen:</strong> Das Arbeitsblatt nennt für 2023/2024 −0,3 % und −0,2 %. Destatis hat diese Werte inzwischen auf −0,9 % und −0,5 % korrigiert. Auch das ist ein Informationsproblem der Wirtschaftspolitik.</li>
   </ul></div>`;
}

/* Start */
if(S.timer && S.timer.running){ startTimer(); }
render();
</script>
